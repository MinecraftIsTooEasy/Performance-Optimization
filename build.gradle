plugins {
    id 'fml-loom' version '0.1'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def useLocalizedArchiveName = Locale.default.country.equalsIgnoreCase("CN")

base {
    // Prefix local JAR names with an optional alias, for example: "[Alias]" + archives_base_name.
    // Maven publishing keeps using the lowercase maven_id configured below.
    archivesName = useLocalizedArchiveName
            ? "[服务端模组性能优化]${project.archives_base_name}"
            : project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // Only declare repositories required by this project because Loom provides
    // the repositories needed for Minecraft and its libraries automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repository declarations.
    maven {
        name = "Spongepowered"
        url = "https://repo.spongepowered.org/repository/maven-public/"
    }
    maven {
        name = "ModdedMITE"
        url = uri("https://maven.limingzxc.top/repository/maven-public/")
    }
}

configurations {
    fml
}

dependencies {
    // Dependency versions are maintained in gradle.properties or alongside project-specific declarations below.
    // Use implementation for required mods, compileOnly for optional integrations,
    // and localRuntime for mods needed only in the development environment.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    fml "com.github.MinecraftIsTooEasy:FishModLoader:3.4.2"
    implementation "com.github.MinecraftIsTooEasy:FishModLoader:3.4.2"
}

def fmlResolvedFile = configurations.fml.singleFile

loom {
//    accessWidenerPath = file("src/main/resources/perfopt.accessWidener")
    mergedMinecraftJar()
    setFML(fmlResolvedFile)
    dependencies.add("mappings", fmlMCPMappings())

    mods {
        "perfopt" {
            sourceSet sourceSets.main
//            sourceSet sourceSets.client
//            sourceSet sourceSets.server
//            For modules in the 'src' directory, only the main source set is required by default.
        }
    }
    runs {
        client {
            String name = project.username
            String width = project.screen_width
            String height = project.screen_height
            programArgs "--userProperties", "{}", "--username", name, "--session", "a.a.a.a", "--width", width, "--height", height
        }
//        server {
//            programArgs "--", ""
//        }
    }
}

processResources {
    inputs.properties(
            version: project.version,
            id: project.mod_id,
            name: project.mod_name
    )

    filesMatching("fml.mod.json") {
        expand(inputs.properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

java {
    // Loom automatically attaches sourcesJar to remapSourcesJar and the build lifecycle when it is present.
    // Remove this line only when source artifacts should not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
}

// Configure the Maven publication.
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.maven_id
            from(components.java)
        }
    }

    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
